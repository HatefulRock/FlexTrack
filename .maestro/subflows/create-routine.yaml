# Creates a routine with one exercise from the picker and returns to the Routines list.
# env: ROUTINE (name), EXERCISE (exercise name from the picker, e.g. "Bench Press")
appId: com.HatefulRock.flextrack
---
- tapOn: "Routines"
- tapOn: "New routine"
- tapOn: "e.g. Push day"
- inputText: ${ROUTINE}
- runFlow: hide-keyboard.yaml
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: ${EXERCISE}
- runFlow: hide-keyboard-android.yaml
- tapOn: "Add ${EXERCISE}, .*"
- tapOn: "Save routine"
- assertVisible: "Edit routine ${ROUTINE}"
