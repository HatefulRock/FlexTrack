# Creates a routine with one exercise from the picker and returns to the Workouts list.
# env: ROUTINE (name), EXERCISE (exercise name from the picker, e.g. "Bench Press")
appId: com.HatefulRock.flextrack
---
- tapOn: "Workouts"
- tapOn: "New workout"
- tapOn: "e.g. Push day"
- inputText: ${ROUTINE}
- runFlow: hide-keyboard.yaml
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: ${EXERCISE}
- runFlow: hide-keyboard-android.yaml
- tapOn: "Add ${EXERCISE}, .*"
- tapOn: "Save workout"
- assertVisible: "Edit workout ${ROUTINE}"
