# The summary's share sheet: it opens, cancels cleanly, and handing off to the system share sheet returns to the summary.
appId: com.HatefulRock.flextrack
tags: [workout, share]
---
- runFlow: ../subflows/launch-starter.yaml
- tapOn: "Start session"
- runFlow:
    file: ../subflows/finish-session.yaml
    env:
      EXERCISES: "4"
- tapOn: "Share session as an image"
- assertVisible: "Share session"
- assertVisible: "Share image"
- tapOn: "Cancel"
- assertNotVisible: "Share image"
- tapOn: "Share session as an image"
- tapOn: "Share image"
# A system chooser (or an error dialog on a device with none) appears; back returns to the app
- pressKey: back
- assertVisible: "Done"
