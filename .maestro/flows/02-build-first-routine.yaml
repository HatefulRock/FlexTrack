# New user builds a routine, schedules a day, adds exercises, and sees it on Today.
appId: com.HatefulRock.flextrack
tags: [smoke, routines]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Workouts"
- tapOn: "New workout"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Notes for this workout"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Notes for this workout Optional.*"
- inputText: "Heavy chest and shoulders"
- tapOn: "e.g. Push day"
- inputText: "Push day"
- runFlow: ../subflows/hide-keyboard.yaml
- runFlow:
    file: ../subflows/add-exercise.yaml
    env:
      EXERCISE: "Bench Press"
- runFlow:
    file: ../subflows/add-exercise.yaml
    env:
      EXERCISE: "Overhead Press"
- runFlow:
    file: ../subflows/add-exercise.yaml
    env:
      EXERCISE: "Push-up"
- tapOn: "Save workout"
- assertVisible: "Edit workout Push day"
# The description sits inside the card's labelled button, which iOS exposes as one element
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Heavy chest and shoulders"
- assertVisible: "1 workout"
- tapOn: "Today"
- assertVisible: "Your first session.*"
- assertVisible: "Start Push day"
