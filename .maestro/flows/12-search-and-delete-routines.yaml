# Housekeeping with several routines: search by name and by exercise, empty result, delete with confirmation.
appId: com.HatefulRock.flextrack
tags: [routines, edge]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/create-routine.yaml
    env:
      ROUTINE: "Alpha"
      EXERCISE: "Bench Press"
- runFlow:
    file: ../subflows/create-routine.yaml
    env:
      ROUTINE: "Bravo"
      EXERCISE: "Run"
- assertVisible: "2 routines"
- tapOn: "Search routines"
- inputText: "bench"
- assertVisible: "1 of 2 routines"
- assertVisible: "Edit routine Alpha"
- assertNotVisible: "Edit routine Bravo"
- eraseText: 5
- inputText: "zzz"
- assertVisible: "No matching routines"
- tapOn: "Clear search"
- assertVisible: "2 routines"
# Cancel the delete, then confirm it
- tapOn: "More actions for Alpha"
- tapOn: "Delete routine"
- assertVisible: "Delete this routine?"
- tapOn: "Cancel"
- assertVisible: "Edit routine Alpha"
- tapOn: "More actions for Alpha"
- tapOn: "Delete routine"
- tapOn: "Delete routine"
- assertNotVisible: "Edit routine Alpha"
- assertVisible: "Edit routine Bravo"
