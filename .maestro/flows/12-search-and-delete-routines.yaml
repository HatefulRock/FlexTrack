# Housekeeping with several routines: search by name and by exercise, empty result, delete with confirmation.
appId: com.HatefulRock.flextrack
tags: [routines, edge]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/create-routine.yaml
    env:
      ROUTINE: "Alpha"
      EXERCISE: "Bench Press"
- runFlow:
    file: ../subflows/create-routine.yaml
    env:
      ROUTINE: "Bravo"
      EXERCISE: "Run"
- assertVisible: "2 workouts"
- tapOn: "Search workouts"
- inputText: "bench"
- assertVisible: "1 of 2 workouts"
- assertVisible: "Edit workout Alpha"
- assertNotVisible: "Edit workout Bravo"
- eraseText: 5
- inputText: "zzz"
- assertVisible: "No matching workouts"
- tapOn: "Clear search"
- assertVisible: "2 workouts"
# Cancel the delete, then confirm it
- tapOn: "More actions for Alpha"
- tapOn: "Delete workout"
- assertVisible: "Delete this workout?"
- tapOn: "Cancel"
- assertVisible: "Edit workout Alpha"
- tapOn: "More actions for Alpha"
- tapOn: "Delete workout"
- tapOn: "Delete workout"
- assertNotVisible: "Edit workout Alpha"
- assertVisible: "Edit workout Bravo"
