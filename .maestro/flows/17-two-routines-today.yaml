# Two routines on the same day: Today leads with one and offers the other as "Also today".
appId: com.HatefulRock.flextrack
tags: [routines, schedule, edge]
---
- runFlow: ../subflows/launch-starter.yaml
- evalScript: ${output.today = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date().getDay()]}
- runFlow:
    file: ../subflows/schedule-routine.yaml
    env:
      ROUTINE: "Full Body A"
      DAY: ${output.today}
- tapOn: "New routine"
- tapOn: "e.g. Push day"
- inputText: "Second"
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn: ${output.today}
- runFlow:
    file: ../subflows/add-exercise.yaml
    env:
      EXERCISE: "Plank"
- tapOn: "Save routine"
- tapOn: "Today"
- assertVisible: "Start Second"
- tapOn: "Start Second"
- assertVisible: "End session"
- assertVisible: "Plank"
