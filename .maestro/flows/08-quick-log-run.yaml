# Logging something already done: a 5 km run lands in history.
appId: com.HatefulRock.flextrack
tags: [smoke, quick-log]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Quick start"
- tapOn: "Log a finished activity"
- assertVisible: "Log activity"
- tapOn: "Distance in km"
- inputText: "5"
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn: "e.g. 24:30"
- inputText: "24:30"
- runFlow: ../subflows/hide-keyboard.yaml
# Scrolling dismisses the numeric keyboard, which has no return key
- scroll
- tapOn: "Notes( How did it feel\\?)?"
- inputText: "Felt good"
- runFlow: ../subflows/hide-keyboard.yaml
- scrollUntilVisible:
    element: "Save activity"
- tapOn: "Save activity"
- assertVisible: "History"
- assertVisible: "Run.*"
