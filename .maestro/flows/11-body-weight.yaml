# Body tab: log weight, reject bad input, set height and see BMI, switch to pounds and back.
appId: com.HatefulRock.flextrack
tags: [body, edge]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Progress"
- tapOn: "Body"
# A new install follows the device region (pounds in the US); this flow works in kilograms.
- tapOn: "Show weights in kilograms"
- tapOn: "Weight in kilograms"
- inputText: "0"
- runFlow: ../subflows/hide-keyboard.yaml
- pressKey: Enter
- assertVisible: "Enter a weight in kg.*"
- tapOn: "Weight in kilograms"
- eraseText: 5
- inputText: "81.4"
- runFlow: ../subflows/hide-keyboard.yaml
- pressKey: Enter
- assertVisible: "Saved 81.4 kg"
- assertVisible: "Latest weight 81.4 kilograms.*"
- tapOn: "Height in centimetres"
- inputText: "180"
- runFlow: ../subflows/hide-keyboard.yaml
- assertVisible: "BMI"
# Absurd weights are refused
- tapOn: "Weight in kilograms"
- inputText: "9999"
- runFlow: ../subflows/hide-keyboard.yaml
- pressKey: Enter
- assertVisible: "Enter a weight in kg.*"
# The same entry in pounds, staying on Body; stored kilograms are unchanged when switching back
- tapOn: "Show weights in pounds"
- assertVisible: "Latest weight 179.5 pounds.*"
- tapOn: "Show weights in kilograms"
- assertVisible: "Latest weight 81.4 kilograms.*"
# Persists across a restart
- stopApp
- launchApp
- tapOn: "Progress"
- tapOn: "Body"
- assertVisible: "Latest weight 81.4 kilograms.*"
