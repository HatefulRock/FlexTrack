name: E2E

# Android: smoke flows on every push to master and pull request, the full suite nightly. iOS: pushes to master, nightly
# and on demand while it is being proven; once it has run clean, drop the push trigger to nightly and on demand.
on:
  push:
    branches: [master]
    paths:
      - '.maestro/**'
      - 'App.tsx'
      - 'pages/**'
      - 'components/**'
      - 'hooks/**'
      - 'utils/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - '.maestro/**'
      - 'App.tsx'
      - 'pages/**'
      - 'components/**'
      - 'hooks/**'
      - 'utils/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.12.0

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_8
          disable-animations: true
          script: bash .maestro/ci-android.sh ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'smoke' }}

      - name: Report failed flows
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          if os.path.exists('maestro.log'):
              tail = open('maestro.log', errors='replace').read().strip().splitlines()[-25:]
              print('::error title=Maestro output::' + '%0A'.join(l.replace('%', '%25')[:300] for l in tail))
          if not os.path.exists('e2e-report.xml'):
              print('::error title=E2E::no report was written, so Maestro never got as far as running a flow')
          else:
              for case in ET.parse('e2e-report.xml').getroot().iter('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      text = ' '.join((failure.get('message') or failure.text or 'failed').split())[:400]
                      print(f"::error title=Flow {case.get('name')}::{text}")
          PY

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-report
          path: |
            e2e-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 75
    # Not yet proven on a runner: report failures without turning the nightly red until it has run clean.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios

      - name: Build for the simulator
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          xcodebuild -workspace "$WORKSPACE" -scheme FlexTrack -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/FlexTrack.app
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows
        run: maestro --device "$UDID" test --exclude-tags=android-only --format junit --output e2e-report.xml .maestro > maestro.log 2>&1 || { tail -60 maestro.log; exit 1; }

      - name: Report failed flows
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          if os.path.exists('maestro.log'):
              tail = open('maestro.log', errors='replace').read().strip().splitlines()[-25:]
              print('::error title=Maestro output::' + '%0A'.join(l.replace('%', '%25')[:300] for l in tail))
          if not os.path.exists('e2e-report.xml'):
              print('::error title=E2E::no report was written, so Maestro never got as far as running a flow')
          else:
              for case in ET.parse('e2e-report.xml').getroot().iter('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      text = ' '.join((failure.get('message') or failure.text or 'failed').split())[:400]
                      print(f"::error title=Flow {case.get('name')}::{text}")
          PY

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-report-ios
          path: |
            e2e-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore
