name: E2E

# Smoke flows on every pull request, the full suite nightly. Android only: the emulator runs on a Linux runner.
on:
  pull_request:
    paths:
      - '.maestro/**'
      - 'App.tsx'
      - 'pages/**'
      - 'components/**'
      - 'hooks/**'
      - 'utils/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.12.0

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_8
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              maestro test --include-tags=smoke --format junit --output e2e-report.xml .maestro
            else
              maestro test --format junit --output e2e-report.xml .maestro
            fi

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-report
          path: |
            e2e-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore
