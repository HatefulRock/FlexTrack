name: E2E

# Android: smoke flows on every pull request, the full suite nightly. iOS: nightly and on demand only, since macOS
# minutes cost ten times as much.
on:
  pull_request:
    paths:
      - '.maestro/**'
      - 'App.tsx'
      - 'pages/**'
      - 'components/**'
      - 'hooks/**'
      - 'utils/**'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.12.0

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_8
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              maestro test --include-tags=smoke --format junit --output e2e-report.xml .maestro
            else
              maestro test --format junit --output e2e-report.xml .maestro
              bash .maestro/adb/unreadable-data.sh
            fi

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-report
          path: |
            e2e-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 75
    # Not yet proven on a runner: report failures without turning the nightly red until it has run clean.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios

      - name: Build for the simulator
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          xcodebuild -workspace "$WORKSPACE" -scheme FlexTrack -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/FlexTrack.app
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows
        run: maestro --device "$UDID" test --exclude-tags=android-only --format junit --output e2e-report.xml .maestro

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-report-ios
          path: |
            e2e-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore
