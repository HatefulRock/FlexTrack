name: EAS build

# Builds on Expo's servers and, when submitting, uploads the result to Google Play.
#
# Triggers:
#   - Push a tag like v1.0.1: Android production build, uploaded to the Play closed
#     testing track (eas.json > submit.production).
#   - Run it by hand from the Actions tab and pick platform, profile and whether to submit.
#
# Needs:
#   - EXPO_TOKEN repository secret.
#   - For submitting: a Google Play service account key uploaded to EAS
#     (expo.dev > project > Credentials > Android > Google Service Account Key).
#   - For iOS: APPLE_TEAM_ID repository secret.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: eas.json build profile
        type: choice
        options: [production, preview, wear]
        default: production
      submit:
        description: Upload to the store when the build finishes (production only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.platform || 'android' }}-${{ inputs.profile || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORM: ${{ inputs.platform || 'android' }}
      PROFILE: ${{ inputs.profile || 'production' }}
      # Tag pushes always submit; manual runs submit when asked, and only for production.
      SUBMIT: ${{ (github.event_name == 'push' || (inputs.submit && inputs.profile == 'production')) && 'true' || 'false' }}

    steps:
      - name: Check for the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --no-wait queues the build and exits; follow it on expo.dev.
      # With --auto-submit, EAS uploads to the store itself once the build succeeds.
      # versionCode is bumped on Expo's side (autoIncrement + remote app version).
      - name: Start EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait)
          if [ "$SUBMIT" = "true" ]; then args+=(--auto-submit); fi
          npx --yes eas-cli@latest build "${args[@]}" | tee eas-output.txt
          {
            echo "### EAS build: $PLATFORM / $PROFILE"
            echo "Submit to store: $SUBMIT"
            grep -Eo 'https://expo\.dev/\S+' eas-output.txt | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
