name: EAS build

# Starts a build on Expo's servers. Run it from the Actions tab.
# Needs the EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: eas.json build profile
        type: choice
        options: [production, preview, wear]
        default: production

permissions:
  contents: read

concurrency:
  group: eas-build-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check for the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret first (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --no-wait queues the build and exits; follow it on expo.dev.
      # versionCode is bumped on Expo's side (autoIncrement + remote app version).
      - name: Start EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          npx --yes eas-cli@latest build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive --no-wait
